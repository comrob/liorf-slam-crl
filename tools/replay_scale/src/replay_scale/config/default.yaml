/**:
  ros__parameters:
    complementaryOdom:

      # Whether to apply the estimated scale to the complementary odometry.
      # If false, scale is still estimated and logged but not applied.
      scaleEstimationApply: true

      # Minimum non-degenerate speed [m/s] required for a scale sample to
      # be considered observable. Samples below this threshold are discarded.
      scaleMinNonDegenerateSpeed: 0.1

      # Number of frames to lag the anchor pose for scale estimation.
      # Larger values reduce sensitivity to per-frame noise at the cost of latency.
      scaleBaselineFrameLag: 10

      # Number of recent observable samples to average for the applied scale.
      scaleSmoothingWindowSize: 50

      # If true, the Z component of translations is zeroed before scale
      # estimation (useful for ground-vehicle / planar-motion datasets).
      ignore_dz: true

      # Additional multiplier applied to complementary odometry translation.
      # The recorded twists already include the online run's translationScale;
      # this is an extra replay-time factor on top of that.
      translationScale: 1.0

# Settings for the replay_scale tool itself (not a ROS
# parameter tree; this key is ignored by any ROS node loading this file as
# a parameters YAML since it does not match a node/wildcard name).
replay_scale_tool:

  # Scale source: fixed, recorded, or estimated. See replay-scale-trajectory --help.
  scale_mode: estimated

  # Constant translation scales to replay with when scale_mode is "fixed".
  scales: [1.0]

  # Base directory for output files. Empty string means alongside the input CSV.
  output_dir: ""

  # Subfolder under output_dir for outputs; trajectories/ and log/ are created under it.
  output_subdir: replay

  # Also emit the LiDAR-only trajectory (no degeneracy override).
  no_correction: false

  # Replay with the recorded per-frame scale and report drift vs recorded effective.
  validate: false

  # How the degeneracy override is applied.
  #   twist6      - node parity: projects the full 6D twist onto the basis. The
  #                 inner product mixes metres and radians, so residual angular
  #                 content in the basis turns the correction into a rotation.
  #   translation - projects only the translation onto the degenerate directions
  #                 and leaves orientation to LiDAR. Use where rotation is
  #                 observable (tunnel walls constrain yaw), so any injected
  #                 heading is spurious.
  correction_mode: twist6 # translation 

  # Replay against a complementary odometry source other than the one used
  # online. The replay re-synchronizes it against the same LiDAR frame stamps,
  # using the same nearest-sample matching the node performs.
  # complementary_source:

    # TUM file of absolute odometry poses ("stamp tx ty tz qx qy qz qw").
    # Empty keeps the twist the online run baked into scale_replay_frames.csv.
    # The node logs its own raw stream to complementary_odom_stream.tum, which
    # can be passed here directly.
    # path: ""

    # # Reject a frame when the nearest odometry sample to either of its two LiDAR
    # # stamps is farther away than this. Matches the node's 0.25 s gate.
    # max_match_dt_s: 0.25

    # T_complementary_to_lidar override (odometry frame -> LiDAR frame). Omit
    # to reuse the extrinsic the run recorded in complementary_odom_meta.yaml;
    # set it when the alternative source sits on a different mounting point.
    # extrinsic:
    #   translation: [0.0, 0.0, 0.0]
    #   rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

  # replay_scale_tool:
  # scale_mode: estimated

