[project]
name = "replay-scale"
version = "0.1.0"
description = "Offline replay of LILI complementary-odometry scaling and degeneracy pose correction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
replay-scale-trajectory = "replay_scale.cli:main"
replay-scale-plot-trajectories = "replay_scale.cli:main_plot"
replay-scale-gui = "replay_scale.gui.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_scale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
