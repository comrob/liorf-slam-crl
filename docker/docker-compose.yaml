# --- Shared Configuration Template (Root Level) ---
# --- Shared Configuration Template (Root Level) ---
x-dev-config: &common-config
  network_mode: host
  ipc: host
  pid: host
  user: "${USER_UID:-1000}:${USER_GID:-1000}"
  devices:
    - /dev/dri:/dev/dri
  group_add:
    - video
    - "${RENDER_GID:-992}" # <--- Use numeric GID variable instead of text string
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities:
              - gpu
              - graphics
              - display
              - compute
              - utility
  environment:
    - DISPLAY=${DISPLAY}
    - ROS_DOMAIN_ID=0
    - QT_X11_NO_MITSHM=1
    - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    - ZENOH_CONFIG_URI=file:///home/dev/zenoh.json5
    # --- Force Hybrid eGPU PRIME Offloading to NVIDIA ---
    - __NV_PRIME_RENDER_OFFLOAD=1
    - __GLX_VENDOR_LIBRARY_NAME=nvidia
    - __VK_LAYER_NV_optimus=NVIDIA_only
    # --- Legacy fallbacks for backward compatibility ---
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    # --- Distributed compilation arguments ---
    - DISTCC_HOSTS=${DISTCC_HOSTS:-}
    - CCACHE_PREFIX=${CCACHE_PREFIX:-}
    - COLCON_PARALLEL_WORKERS=${COLCON_PARALLEL_WORKERS:-16}

# --- Shared Build Arguments Anchor ---
x-build-args: &common-build-args
  USER_UID: ${USER_UID:-1000}
  USER_GID: ${USER_GID:-1000}
  DISTCC_HOSTS: ${DISTCC_HOSTS:-}
  CCACHE_PREFIX: ${CCACHE_PREFIX:-}
  COLCON_PARALLEL_WORKERS: ${COLCON_PARALLEL_WORKERS:-16}

services:
  # --- 0. Zenoh Router (Coordinator) ---
  zenoh_router:
    <<: *common-config
    image: lili_jazzy_dev
    container_name: zenoh_router
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
      network: host
      args: *common-build-args
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    command: bash -lc "source /opt/ros/jazzy/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"

  # --- 1. VS Code Background Service ---
  lili_vscode:
    <<: *common-config
    image: lili_jazzy_dev
    container_name: lili_vscode
    depends_on:
      - zenoh_router
    build: 
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
      network: host
      args: *common-build-args
    volumes:
      - ..:/home/dev/ros2_ws/src/lili
      - ${HOST_MAPS_PATH}:/home/dev/Downloads/LOAM
      - ${HOST_BAGS_PATH:-../bags}:/home/dev/bags
      - ${HOST_ROS_PATH:-/home/seva/.ros}:/home/dev/.ros
      - ./cache/build:/home/dev/ros2_ws/build
      - ./cache/install:/home/dev/ros2_ws/install
      - ./cache/log:/home/dev/ros2_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOST_ZENOH_CONFIG:-./zenoh.json5}:/home/dev/zenoh.json5:ro
    command: sleep infinity

  # --- 2. Active Terminal Runner (Dev) ---
  lili_dev:
    <<: *common-config
    image: lili_jazzy_dev
    container_name: lili_dev
    depends_on:
      - zenoh_router
    build: 
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
      network: host
      args: *common-build-args
    volumes:
      - ..:/home/dev/ros2_ws/src/lili
      - ${HOST_MAPS_PATH}:/home/dev/Downloads/LOAM
      - ${HOST_BAGS_PATH:-../bags}:/home/dev/bags
      - ${HOST_ROS_PATH:-/home/seva/.ros}:/home/dev/.ros
      - ./cache/build:/home/dev/ros2_ws/build
      - ./cache/install:/home/dev/ros2_ws/install
      - ./cache/log:/home/dev/ros2_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOST_ZENOH_CONFIG:-./zenoh.json5}:/home/dev/zenoh.json5:ro
    command: sleep infinity

  # --- 3. Production Runner (Pre-Built) ---
  lili_run:
    <<: *common-config
    image: lili_jazzy_prod
    container_name: lili_run
    depends_on:
      - zenoh_router
    build: 
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
      network: host
      args: *common-build-args
    volumes:
      - ${HOST_MAPS_PATH}:/home/dev/Downloads/LOAM
      - ${HOST_BAGS_PATH:-../bags}:/home/dev/bags
      - ${HOST_ROS_PATH:-/home/seva/.ros}:/home/dev/.ros
      - ../config:/home/dev/ros2_ws/install/lili/share/lili/config
      - ../launch:/home/dev/ros2_ws/install/lili/share/lili/launch
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOST_ZENOH_CONFIG:-./zenoh.json5}:/home/dev/zenoh.json5:ro
    command: sleep infinity
  # --- 4. Bag Player ---
  bag_player:
    <<: *common-config
    image: lili_jazzy_dev
    user: "dev:dev"
    container_name: bag_player
    depends_on:
      - zenoh_router
    environment:
      - ROS_DOMAIN_ID=0
      - HOME=/home/dev
      - BAG_FILENAME=${BAG_FILENAME:-$DEFAULT_BAG_FILENAME}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_CONFIG_URI=file:///home/dev/zenoh.json5
    volumes:
      - ${HOST_BAGS_PATH}:/bag_data
      - ${HOST_ZENOH_CONFIG:-./zenoh.json5}:/home/dev/zenoh.json5:ro
    command: sleep infinity

  # --- 5. Run SLAM (Benchmark Testing - Optional Profile) ---
  # Activate with: docker compose --profile run_slam up run_slam
  # This profile is for LOCAL testing only to validate framework compatibility
  # External evaluation frameworks use their own orchestration
  run_slam:
    profiles: ["run_slam"]
    <<: *common-config
    image: lili_jazzy_prod
    user: "dev:dev"
    container_name: lili_run_slam
    depends_on:
      - zenoh_router
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
      - HOME=/home/dev
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_CONFIG_URI=file:///config/dds/zenoh.json5
    volumes:
      - ${HOST_ROS_PATH:-/home/seva/.ros}:/home/dev/.ros
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./zenoh.json5:/config/dds/zenoh.json5:ro
      - ../config/docker_override.yaml:/config/docker_override.yaml:ro
    command: ros2 launch lili run_lili_bench.py