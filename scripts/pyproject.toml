[tool.poetry]
name = "liorf-map-tools"
version = "0.1.0"
description = "Utility tools for LIORF saved-map export and visualization"
authors = ["LIORF contributors"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.26.0"
folium = "^0.16.0"
matplotlib = "^3.8.0"
pyyaml = "^6.0"

[tool.poetry.scripts]
visualize-saved-map-satellite = "visualize_saved_map_satellite:main"
plot-jacobian-perturbation-degeneracy = "plot_jacobian_perturbation_degeneracy:main"
plot-complementary-odom-scale-diagnostics = "plot_complementary_odom_scale_diagnostics:main"
replay-scale-trajectory = "replay_scale_trajectory:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
